name: 单元测试与发布

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK（与本地 gradle 构建一致，temurin 25）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 运行全量 JVM 单元测试
        run: ./gradlew :app:testDebugUnitTest

      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/

  build:
    name: Release 构建
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK（temurin 25）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 SDK 37.0（runner 预装集不含）
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: 还原签名材料（Secrets 注入；缺失则发版链路显式失败，不出未签名包）
        env:
          VLP_KEYSTORE_BASE64: ${{ secrets.VLP_KEYSTORE_BASE64 }}
        run: |
          test -n "$VLP_KEYSTORE_BASE64" || { echo "::error::缺少 Secret VLP_KEYSTORE_BASE64"; exit 1; }
          echo "$VLP_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: 还原 v3 轮换签名材料（Secrets 注入；缺失则发版链路显式失败）
        env:
          VLP_V3_KEYSTORE_BASE64: ${{ secrets.VLP_V3_KEYSTORE_BASE64 }}
          VLP_V3_STORE_PASSWORD: ${{ secrets.VLP_V3_STORE_PASSWORD }}
        run: |
          test -n "$VLP_V3_KEYSTORE_BASE64" || { echo "::error::缺少 Secret VLP_V3_KEYSTORE_BASE64"; exit 1; }
          test -n "$VLP_V3_STORE_PASSWORD" || { echo "::error::缺少 Secret VLP_V3_STORE_PASSWORD"; exit 1; }

      - name: 构建 Release APK（旧章基线 + v3 新章 lineage 重签）
        env:
          VLP_STORE_PASSWORD: ${{ secrets.VLP_STORE_PASSWORD }}
          VLP_KEY_ALIAS: ${{ secrets.VLP_KEY_ALIAS }}
          VLP_KEY_PASSWORD: ${{ secrets.VLP_KEY_PASSWORD }}
          VLP_V3_STORE_PASSWORD: ${{ secrets.VLP_V3_STORE_PASSWORD }}
        run: ./gradlew :app:rotateSignRelease

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: VivoLivePhoto-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 创建 GitHub Release（仅 v* tag；含 test 的 tag 发 Pre-release）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/VivoLivePhoto.apk "VivoLivePhoto-${GITHUB_REF_NAME}.apk"
          EXTRA=""
          case "$GITHUB_REF_NAME" in
            *test*) EXTRA="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" "VivoLivePhoto-${GITHUB_REF_NAME}.apk" \
            $EXTRA --generate-notes --title "影中影 $GITHUB_REF_NAME"
