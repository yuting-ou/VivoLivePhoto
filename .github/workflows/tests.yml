name: 单元测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK（与本地 gradle 构建一致，temurin 25）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 运行全量 JVM 单元测试
        run: ./gradlew :app:testDebugUnitTest

      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/

  build:
    name: Release 构建
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK（temurin 25）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 SDK 37.0（runner 预装集不含）
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: VivoLivePhoto-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
